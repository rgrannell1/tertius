[project]
name = "tertius"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "bookman",
    "pyzmq>=26.0.0",
]

[tool.uv.sources]
orbis = { path = "../orbis", editable = true }
bookman = { path = "../bookman", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "hypothesis>=6.152.1",
    "orbis",
    "pyright>=1.1.408",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "vulture",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tertius"]

[tool.pytest.ini_options]
timeout = 30

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "BLE", "SIM", "RUF", "PLR", "PLC", "C"]

[tool.mypy]
strict = true

[tool.ruff.lint.pylint]
max-statements = 14
max-args = 4

[tool.ruff.lint.mccabe]
max-complexity = 7
